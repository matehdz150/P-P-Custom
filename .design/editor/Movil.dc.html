<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@700;800&amp;family=Poppins:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; background: #f3f3f1; color: #2b2812; font-family: Poppins, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    h1, h2, h3, p { margin: 0; }
    a { color: #2b2812; text-decoration: none; }
    .display { font-family: Figtree, "Segoe UI", system-ui, sans-serif; font-weight: 800; }
    .fx { flex-shrink: 0; }
  </style>
</helmet>

<div style="display: flex; flex-direction: column; width: 390px; height: 844px; background: #f3f3f1; color: #2b2812; overflow: hidden;">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 60px; flex-shrink: 0; padding: 0 12px 0 8px; background: #fffdf8; border-bottom: 1px solid rgba(43,40,18,0.1);">
    <div style="display: flex; align-items: center; gap: 8px; min-width: 0;">
      <span style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#2b2812" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </span>
      <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
        <span class="display" style="font-size: 15px; line-height: 19px; letter-spacing: -0.32px;">Playera oversize</span>
        <span style="font-size: 11px; line-height: 15px; color: rgba(43,40,18,0.55);">Delante · 2 elementos</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; padding: 3px; border-radius: 9999px; background: #f3f3f1;">
      <span style="display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 9999px; background: #2b2812; font-size: 13px; font-weight: 600; color: #fffdf8;">Editar</span>
      <span style="display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; color: rgba(43,40,18,0.6);">Probar</span>
    </div>
  </header>

  <main style="position: relative; flex-grow: 1; min-height: 0;">

    <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
      <div style="position: relative; width: 320px; height: 296px;">
        <img src="mock-frente.webp" alt="Playera oversize, vista delantera" style="width: 320px; height: 296px; object-fit: contain;">

        <div style="position: absolute; left: 103px; top: 65px; width: 114px; height: 142px; border: 1.5px dashed rgba(43,40,18,0.45); border-radius: 4px;"></div>

        <div style="position: absolute; left: 103px; top: 102px; width: 114px; display: flex; align-items: center; justify-content: center; height: 38px; border: 1.5px solid #7cb944;">
          <span class="display" style="font-size: 19px; letter-spacing: -0.4px;">GEN 2026</span>
          <span style="position: absolute; left: -5px; top: -5px; width: 9px; height: 9px; border-radius: 2px; background: #fffdf8; box-shadow: 0 0 0 1.5px #7cb944;"></span>
          <span style="position: absolute; right: -5px; top: -5px; width: 9px; height: 9px; border-radius: 2px; background: #fffdf8; box-shadow: 0 0 0 1.5px #7cb944;"></span>
          <span style="position: absolute; left: -5px; bottom: -5px; width: 9px; height: 9px; border-radius: 2px; background: #fffdf8; box-shadow: 0 0 0 1.5px #7cb944;"></span>
          <span style="position: absolute; right: -5px; bottom: -5px; width: 9px; height: 9px; border-radius: 2px; background: #fffdf8; box-shadow: 0 0 0 1.5px #7cb944;"></span>
        </div>
      </div>
    </div>

    <div style="position: absolute; left: 12px; top: 12px; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 12px; background: #fffdf8; box-shadow: 0 4px 14px rgba(43,40,18,0.08);">
      <span style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 9px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 7L4.5 11.5 9 16M4.5 11.5H14a5.5 5.5 0 010 11h-2" stroke="#2b2812" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </span>
      <span style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 9px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 7l4.5 4.5L15 16M19.5 11.5H10a5.5 5.5 0 000 11h2" stroke="rgba(43,40,18,0.35)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </span>
    </div>

    <!-- El aviso de límite aparece donde estás mirando, no en un panel -->
    <div style="position: absolute; right: 12px; top: 12px; display: flex; align-items: center; gap: 8px; padding: 9px 13px; border-radius: 9999px; background: #2b2812;">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #a5f35c;"></span>
      <span style="font-size: 12px; font-weight: 500; color: #fffdf8;">2 de 2 elementos · 3 de 4 tintas</span>
    </div>

    <!-- Barra de la selección, encima de la de herramientas -->
    <div style="position: absolute; left: 12px; right: 12px; bottom: 74px; display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 16px; background: #fffdf8; box-shadow: 0 12px 30px rgba(43,40,18,0.16);">
      <span style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border-radius: 11px; background: #f3f3f1; font-size: 13px; font-weight: 500;">
        Figtree
        <svg width="11" height="11" viewBox="0 0 14 14" fill="none" class="fx"><path d="M3.5 5.5L7 9l3.5-3.5" stroke="#2b2812" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </span>
      <span style="display: flex; align-items: center; height: 44px; padding: 0 13px; border-radius: 11px; background: #f3f3f1; font-size: 13px; font-weight: 500;">19</span>
      <span style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 11px;"><span style="width: 22px; height: 22px; border-radius: 50%; background: #2b2812;"></span></span>
      <span style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 11px; font-size: 15px; font-weight: 700;">B</span>
      <span style="flex-grow: 1;"></span>
      <span style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 11px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12.5a1.5 1.5 0 001.5 1.5h7a1.5 1.5 0 001.5-1.5L18 7M9.5 7V5a1 1 0 011-1h3a1 1 0 011 1v2" stroke="#2b2812" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </span>
    </div>

    <div style="position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; padding: 4px; border-radius: 9999px; background: #fffdf8; box-shadow: 0 4px 14px rgba(43,40,18,0.08);">
      <span style="display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 17px; border-radius: 9999px; background: #2b2812; font-size: 13px; font-weight: 600; color: #fffdf8;">
        Delante
        <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9999px; background: #a5f35c; font-size: 10px; font-weight: 700; color: #2b2812;">1</span>
      </span>
      <span style="display: inline-flex; align-items: center; height: 38px; padding: 0 17px; border-radius: 9999px; font-size: 13px; font-weight: 500; color: rgba(43,40,18,0.6);">Detrás</span>
    </div>
  </main>

  <!-- Precio siempre a la vista, como en la ficha -->
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; padding: 10px 12px; background: #fffdf8; border-top: 1px solid rgba(43,40,18,0.1);">
    <div style="display: flex; flex-direction: column; gap: 1px;">
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <span class="display" style="font-size: 20px; line-height: 22px; letter-spacing: -0.42px;">$289</span>
        <span style="font-size: 12px; color: rgba(43,40,18,0.6);">por pieza</span>
      </div>
      <span style="font-size: 11px; color: rgba(43,40,18,0.5);">30 piezas · $8,670</span>
    </div>

    <span style="display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 22px; border-radius: 9999px; background: #a5f35c; font-size: 15px; font-weight: 600;">
      Guardar diseño
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" class="fx"><path d="M5.833 10.5L9.333 7L5.833 3.5" stroke="#2b2812" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </span>
  </div>

  <!-- Herramientas, al alcance del pulgar -->
  <nav style="display: flex; align-items: center; justify-content: space-around; gap: 4px; height: 84px; flex-shrink: 0; padding: 0 8px 12px 8px; background: #2b2812;">
    <span style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; width: 64px; height: 60px; border-radius: 16px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 16V4M12 4l-4 4M12 4l4 4M5 20h14" stroke="rgba(255,253,248,0.85)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="font-size: 10px; font-weight: 500; color: rgba(255,253,248,0.65);">Subir</span>
    </span>

    <span style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; width: 64px; height: 60px; border-radius: 16px; background: #a5f35c;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 6V4h14v2M12 4v16M9 20h6" stroke="#2b2812" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="font-size: 10px; font-weight: 600; color: #2b2812;">Texto</span>
    </span>

    <span style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; width: 64px; height: 60px; border-radius: 16px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="8" cy="8" r="4.2" stroke="rgba(255,253,248,0.85)" stroke-width="1.8"></circle><rect x="11" y="11" width="9" height="9" rx="1.6" stroke="rgba(255,253,248,0.85)" stroke-width="1.8"></rect></svg>
      <span style="font-size: 10px; font-weight: 500; color: rgba(255,253,248,0.65);">Formas</span>
    </span>

    <span style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; width: 64px; height: 60px; border-radius: 16px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3l8.5 4.5L12 12 3.5 7.5 12 3z" stroke="rgba(255,253,248,0.85)" stroke-width="1.8" stroke-linejoin="round"></path><path d="M4 12.5L12 17l8-4.5M4 16.8L12 21l8-4.2" stroke="rgba(255,253,248,0.85)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="font-size: 10px; font-weight: 500; color: rgba(255,253,248,0.65);">Capas</span>
    </span>

    <span style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; width: 64px; height: 60px; border-radius: 16px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="rgba(255,253,248,0.85)" stroke-width="1.8"></circle><path d="M12 11v5.5M12 7.6v.6" stroke="rgba(255,253,248,0.85)" stroke-width="1.9" stroke-linecap="round"></path></svg>
      <span style="font-size: 10px; font-weight: 500; color: rgba(255,253,248,0.65);">Info</span>
    </span>
  </nav>
</div>
</x-dc>
</body>
</html>
