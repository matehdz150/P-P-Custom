services:
  postgres:
    image: postgres:16
    container_name: ppcustom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ppcustom
      POSTGRES_PASSWORD: ppcustom123
      POSTGRES_DB: ppcustom_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppcustom -d ppcustom_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- API (NestJS, hot reload con tsx watch) ----------
  api:
    image: node:20-bookworm-slim
    container_name: ppcustom_api
    working_dir: /app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ppcustom:ppcustom123@postgres:5432/ppcustom_db
      PORT: "8000"
      FRONTEND_URL: http://localhost:3000/catalogo
      NODE_ENV: development
      # ayuda al watcher con bind mounts (macOS/Windows)
      CHOKIDAR_USEPOLLING: "true"
      # DynamoDB. Las llaves NO van aquí: el SDK las lee del perfil que se
      # monta abajo. En Lambda vendrán del rol de ejecución.
      AWS_PROFILE: kustto-admin
      AWS_REGION: us-east-1
      KUSTTO_TABLA: kustto-prod
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - api_app_node_modules:/app/apps/api/node_modules
      # `pnpm install` instala TODO el workspace, así que sin este volumen
      # el contenedor escribe enlaces de Linux dentro de apps/web/node_modules
      # del host y rompe el `next dev` de Windows.
      - api_web_node_modules:/app/apps/web/node_modules
      # Solo lectura: el contenedor usa el perfil, nunca lo escribe.
      - ${USERPROFILE}/.aws:/root/.aws:ro
    command: >
      sh -c "corepack enable &&
             pnpm install &&
             pnpm --filter api start:dev"

  # ---------- WEB (Next.js dev, HMR) ----------
  web:
    image: node:20-bookworm-slim
    container_name: ppcustom_web
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # navegador -> API publicada en el host
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # SSR dentro del contenedor -> API por nombre de servicio
      API_URL_INTERNAL: http://api:8000
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
      - web_next_cache:/app/apps/web/.next
    command: >
      sh -c "corepack enable &&
             pnpm install &&
             pnpm --filter web exec next dev -H 0.0.0.0 -p 3000"

volumes:
  postgres_data:
  api_node_modules:
  api_app_node_modules:
  api_web_node_modules:
  web_node_modules:
  web_app_node_modules:
  web_next_cache:
