<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bordado: prueba de hilo principal</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; }
  #giro { width: 28px; height: 28px; border: 4px solid #ddd; border-top-color: #111;
          border-radius: 50%; animation: gira 1s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  pre { background: #f5f5f5; padding: 12px; border-radius: 8px; }
</style>
</head>
<body>
<h1>Preparación de bordado fuera del hilo principal</h1>
<div id="giro"></div>
<p id="estado">esperando</p>
<pre id="salida"></pre>

<script>
/*
 * Lo que se mide: los saltos entre fotogramas mientras el worker trabaja.
 *
 * Si la preparación corriera en el hilo principal, el bucle de `requestAnimationFrame`
 * se pararía en seco durante segundos y el salto máximo sería del orden del
 * trabajo entero. Con el worker, los saltos se quedan en los 16 ms de un
 * fotograma normal. Eso es lo que hace la diferencia entre "un spinner que gira"
 * y "una pestaña muerta", y no se puede ver en una captura.
 */
const salida = document.getElementById("salida");
const estado = document.getElementById("estado");
const log = (t) => { salida.textContent += t + "\n"; };

let ultimo = performance.now();
let mayorSalto = 0;
let fotogramas = 0;
let midiendo = false;
function tic(ahora) {
  if (midiendo) {
    const salto = ahora - ultimo;
    if (salto > mayorSalto) mayorSalto = salto;
    fotogramas++;
  }
  ultimo = ahora;
  requestAnimationFrame(tic);
}
requestAnimationFrame(tic);

/** Una imagen sintética con mucha estructura: da trabajo de verdad al pipeline. */
function rasterDePrueba(ancho, alto) {
  const datos = new Uint8ClampedArray(ancho * alto * 4);
  for (let y = 0; y < alto; y++) {
    for (let x = 0; x < ancho; x++) {
      const i = (y * ancho + x) * 4;
      const banda = Math.floor(x / 46) % 3;
      const franja = Math.floor(y / 38) % 2;
      const dentro = (x > 30 && x < ancho - 30 && y > 30 && y < alto - 30);
      const c = !dentro ? [255, 255, 255]
        : banda === 0 ? [17, 17, 17]
        : banda === 1 ? (franja ? [11, 61, 145] : [255, 255, 255])
        : [246, 174, 45];
      datos[i] = c[0]; datos[i + 1] = c[1]; datos[i + 2] = c[2]; datos[i + 3] = 255;
    }
  }
  return datos;
}

const worker = new Worker("./bordado.worker.js");
const resultados = {};

function preparar(revision, ancho, alto) {
  const datos = rasterDePrueba(ancho, alto);
  return new Promise((resolver) => {
    const escuchar = (evento) => {
      if (evento.data.revision !== revision) return;
      worker.removeEventListener("message", escuchar);
      resolver(evento.data);
    };
    worker.addEventListener("message", escuchar);
    worker.postMessage({
      tipo: "preparar",
      solicitud: {
        revision, productId: "p", sideId: "front",
        widthMm: 70, heightMm: 50,
        sourceSnapshotHash: "a".repeat(64),
        fuentes: [{
          tipo: "raster", sourceObjectId: "img",
          datos, ancho, alto, mmPorPx: 0.05, desplazamientoMm: 0.1,
        }],
      },
    }, [datos.buffer]);
  });
}

async function main() {
  estado.textContent = "preparando en el worker...";
  midiendo = true;
  const t0 = performance.now();
  const r = await preparar(1, 1404, 1004);
  const ms = performance.now() - t0;
  midiendo = false;

  log(`preparacion: ${ms.toFixed(0)} ms`);
  log(`estado del worker: ${r.estado}`);
  if (r.estado === "listo") log(`objetos: ${r.design.objects.length}`);
  if (r.estado === "rechazado") log(`incidencias: ${r.incidencias.map((i) => i.code).join(",")}`);
  log(`fotogramas durante la preparacion: ${fotogramas}`);
  log(`salto maximo entre fotogramas: ${mayorSalto.toFixed(1)} ms`);

  // Y la carrera: se lanza A, se lanza B encima, sólo puede ganar B.
  estado.textContent = "probando la carrera...";
  const a = preparar(2, 1404, 1004);
  const b = preparar(3, 700, 500);
  const [ra, rb] = await Promise.all([a, b]);
  log(`carrera: A=${ra.revision} B=${rb.revision} -> gana ${Math.max(ra.revision, rb.revision)}`);
  log(`A se descarta por revision: ${ra.revision < rb.revision}`);

  estado.textContent = "listo";
  window.__resultado = {
    ms, fotogramas, mayorSalto,
    estadoWorker: r.estado,
    objetos: r.estado === "listo" ? r.design.objects.length : 0,
  };
}

main().catch((e) => { log("ERROR " + e.message); estado.textContent = "error"; window.__resultado = { error: e.message }; });
</script>
</body>
</html>
