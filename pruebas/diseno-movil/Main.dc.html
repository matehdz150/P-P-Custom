<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f2f3ea; color: #2b2812; overflow: hidden; position: relative;">

  <div style="flex: none; background: #fffdf8; border-top: 1px solid rgba(43,40,18,0.1); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 28px rgba(43,40,18,0.10); padding: 8px 0 0;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px 12px;">

        <span style="font-family: Figtree, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: -0.01em;">Delante · Hueso</span>

      </span>
      <span style="display: flex; align-items: center; gap: 5px; flex: none;">
        <span style="width: 26px; height: 26px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 2px #fffdf8, 0 0 0 4px #2b2812;"></span>
        <span style="width: 26px; height: 26px; border-radius: 999px; background: #171717; border: 1px solid rgba(43,40,18,0.2);"></span>
        <span style="width: 26px; height: 26px; border-radius: 999px; background: #e8dcc8; border: 1px solid rgba(43,40,18,0.2);"></span>
      </span>
    </div>

    <div style="display: flex; gap: 10px; padding: 0 16px 12px; overflow: hidden;">

          <img src="playera.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%;">
        </span>
        <span style="font-size: 12px; font-weight: 600; text-align: center;">Delante</span>

        <span style="font-size: 12px; color: rgba(43,40,18,0.55); text-align: center;">Manga</span>
      </span>
    </div>

    <div style="display: flex; gap: 10px; padding: 0 16px 18px;">
      <span style="flex: none; width: 52px; height: 52px; border-radius: 999px; border: 1.5px solid rgba(43,40,18,0.2); display: flex; align-items: center; justify-content: center;">

        <span style="font-size: 16px; font-weight: 600;">Agregar al carrito</span>
      </span>
